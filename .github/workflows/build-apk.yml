name: Build AI Personal Teacher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check Flutter source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source files OK"

      - name: Create Android project if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            echo "Android project missing."
            echo "Creating Android project..."
            flutter create . --platforms android
          else
            echo "Android project already exists."
          fi

      - name: Check Android project
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project OK"

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
          ]

          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}"/>'

              if permission not in text:
                  text = text.replace(
                      '<manifest',
                      '<manifest',
                      1
                  )

                  pos = text.find('>') + 1
                  text = text[:pos] + '\n' + line + text[pos:]

          manifest.write_text(text)

          print("Android permissions configured.")
          PY

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "================================"
          echo "AI PERSONAL TEACHER APK READY"
          echo "================================"
