name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract app source
        run: |
          mkdir source
          unzip -q AI_Personal_Teacher_v21_Beta_Ready.zip -d source

      - name: Create Android project
        run: flutter create --platforms=android --project-name ai_personal_teacher app

      - name: Copy app source
        run: |
          rm -rf app/lib
          cp -r source/lib app/
          cp source/pubspec.yaml app/

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
