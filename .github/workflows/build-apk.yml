name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter app
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d build_source
          else
            echo "No ZIP found."
            cp -R . build_source/repository
          fi

          PUBSPEC=$(find build_source \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/android/*" \
            | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            PUBSPEC=$(find build_source \
              -type f \
              -name "pubspec.yaml" \
              | head -n 1 || true)
          fi

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android project missing. Generating Android platform..."
            flutter create --platforms=android .
          else
            echo "Android project already exists."
          fi

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

     - name: Disable R8 in Android Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then
            sed -i 's/minifyEnabled[[:space:]]*true/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/shrinkResources[[:space:]]*true/shrinkResources false/g' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled[[:space:]]*=[[:space:]]*true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/isShrinkResources[[:space:]]*=[[:space:]]*true/isShrinkResources = false/g' android/app/build.gradle.kts
          fi

          echo "R8/minification disabled."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
