name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf app
          flutter create --platforms=android app
          cp pubspec.yaml app/pubspec.yaml
          cp -r lib app/lib

      - name: Remove default Flutter test
        run: |
          rm -rf app/test

      - name: Configure Android permissions
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          first_end = text.find(">")

          if first_end == -1:
              raise SystemExit("AndroidManifest.xml is invalid")

          permission_lines = ""

          for permission in permissions:
              if permission not in text:
                  permission_lines += (
                      f'\n    <uses-permission '
                      f'android:name="{permission}"/>'
                  )

          if permission_lines:
              text = (
                  text[:first_end + 1]
                  + permission_lines
                  + text[first_end + 1:]
              )

          speech_query = """
          <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>
          """

          if "android.speech.RecognitionService" not in text:
              text = text.replace(
                  "</manifest>",
                  speech_query + "\n</manifest>"
              )

          manifest.write_text(text)
          print("Android permissions configured successfully.")
          PY

      - name: Get dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
