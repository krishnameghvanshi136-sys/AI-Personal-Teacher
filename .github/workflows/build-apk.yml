name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Personal Teacher APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf app
          flutter create --platforms=android app
          cp pubspec.yaml app/pubspec.yaml

      - name: Copy Flutter source
        run: |
          rm -rf app/lib
          rm -rf app/test
          cp -r lib app/lib

      - name: Add Android permissions
        run: |
          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          sed -i 's#<manifest#<manifest#' "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i '2i\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
            sed -i '2i\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' "$MANIFEST"

          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i '2i\    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"

      - name: Check Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY Secret नहीं मिला!"
            echo "GitHub Settings > Secrets and variables > Actions check करें."
            exit 1
          fi

          echo "GEMINI_API_KEY Secret मौजूद है."

      - name: Get dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Flutter Analyze
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
