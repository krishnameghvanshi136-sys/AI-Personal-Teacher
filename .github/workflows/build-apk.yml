name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Flutter project
        run: |
          rm -rf app
          flutter create --platforms=android app
          cp pubspec.yaml app/pubspec.yaml

      - name: Copy app source
        run: |
          rm -rf app/lib
          cp -r lib app/lib

      - name: Remove test files
        run: |
          rm -rf app/test

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest\n    ' + permission,
                  1
              )

          manifest.write_text(text)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
