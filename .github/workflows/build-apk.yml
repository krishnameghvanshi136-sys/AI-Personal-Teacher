name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf app
          flutter create --platforms=android app
          cp pubspec.yaml app/pubspec.yaml

      - name: Copy Flutter source
        run: |
          rm -rf app/lib
          cp -r lib app/lib

      - name: Add Android permissions
        run: |
          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>' "$MANIFEST"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.BLUETOOTH"/>' "$MANIFEST"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>' "$MANIFEST"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>' "$MANIFEST"

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"

          sed -i '/<\/manifest>/i\
              <queries>\
                  <intent>\
                      <action android:name="android.speech.RecognitionService" />\
                  </intent>\
              </queries>' "$MANIFEST"

      - name: Check Gemini API Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY Secret नहीं मिला!"
            exit 1
          fi

          echo "GEMINI_API_KEY Secret मौजूद है."

      - name: Flutter Pub Get
        working-directory: app
        run: |
          flutter pub get

      - name: Build Release APK
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
