name: Build AI Personal Teacher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          echo "Project files OK"

      - name: Configure Android permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' "$MANIFEST"

          echo "Android permissions configured"

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "======================================"
          echo "AI PERSONAL TEACHER APK READY"
          echo "======================================"
