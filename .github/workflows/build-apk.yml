name: Build AI Personal Teacher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 3. CHECK FLUTTER
      # ==========================================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version


      # ==========================================
      # 4. CHECK PROJECT
      # ==========================================
      - name: Check AI Personal Teacher source
        run: |
          set -e

          echo "Checking project files..."

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "pubspec.yaml found"
          echo "lib/main.dart found"


      # ==========================================
      # 5. CREATE / REPAIR ANDROID PROJECT
      # ==========================================
      - name: Configure Android project
        run: |
          set -e

          echo "Creating Android project..."

          flutter create \
            --platforms=android \
            --project-name=ai_personal_teacher \
            .

          echo "Checking Android Gradle files..."

          if [ -f android/app/build.gradle ]; then
            echo "android/app/build.gradle found"
          elif [ -f android/app/build.gradle.kts ]; then
            echo "android/app/build.gradle.kts found"
          else
            echo "ERROR: Android Gradle file not found"
            exit 1
          fi

          echo "Android project ready."


      # ==========================================
      # 6. REMOVE DEFAULT TEST
      # ==========================================
      - name: Remove default Flutter test
        run: |
          if [ -d "test" ]; then
            rm -rf test
            echo "Default test folder removed."
          else
            echo "No test folder found."
          fi


      # ==========================================
      # 7. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          additions = []

          for permission in permissions
