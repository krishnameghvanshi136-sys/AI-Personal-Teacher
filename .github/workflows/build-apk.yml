name: Build AI Personal Teacher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check Flutter source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source files OK"

      - name: Create Android project if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            echo "Android project missing."
            echo "Creating Android project..."
            flutter create . --platforms android
          else
            echo "Android project already exists."
          fi

      - name: Remove default Flutter test
        run: |
          rm -rf test
          echo "Default Flutter test removed."

      - name: Configure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<application/i\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i\
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>' "$MANIFEST"
          fi

          echo "Android permissions configured."

      - name: Check Android project
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project OK"

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "======================================"
          echo "AI PERSONAL TEACHER APK READY"
          echo "======================================"
