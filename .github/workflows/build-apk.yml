name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Personal Teacher APK
    runs-on: ubuntu-latest

    steps:

      # 1. Repository download
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter setup
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3. Create Android project
      - name: Create Android project
        run: |
          rm -rf app
          flutter create --platforms=android app

          cp pubspec.yaml app/pubspec.yaml

      # 4. Copy latest main.dart
      - name: Copy Flutter source
        run: |
          rm -rf app/lib
          cp -r lib app/lib

      # 5. Add Android permissions
      - name: Configure Android permissions
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          for permission in permissions:
              line = (
                  f'    <uses-permission '
                  f'android:name="{permission}"/>'
              )

              if permission not in text:
                  text = text.replace(
                      "<manifest",
                      "<manifest",
                      1
                  )

                  pos = text.find(">")

                  if pos != -1:
                      text = (
                          text[:pos + 1]
                          + "\n"
                          + line
                          + text[pos + 1:]
                      )

          queries = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          """

          if "android.speech.RecognitionService" not in text:
              text = text.replace(
                  "</manifest>",
                  queries + "\n</manifest>"
              )

          manifest.write_text(text)
          PY

      # 6. Check Gemini API key
      - name: Check Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY Secret नहीं मिला!"
            echo "GitHub Settings > Secrets and variables > Actions check करें."
            exit 1
          fi

          echo "GEMINI_API_KEY Secret मौजूद है."

      # 7. Get Flutter packages
      - name: Flutter Pub Get
        working-directory: app
        run: |
          flutter pub get

      # 8. Check Flutter project
      - name: Flutter Analyze
        working-directory: app
        run: |
          flutter analyze

      # 9. Build release APK
      - name: Build Release APK
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
