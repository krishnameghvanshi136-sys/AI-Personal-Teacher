name: AI Personal Teacher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project files OK"

      - name: Create Android project if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android .
          fi

      - name: Check Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project OK"

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          path.write_text(text)

          print("Android permissions OK")
          PY

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Check APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Personal-Teacher-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build completed
        run: |
          echo "===================================="
          echo "BUILD SUCCESS"
          echo "AI Personal Teacher APK READY"
          echo "===================================="
